<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-image">
        <img src="./assets/images/illustration-article.svg" alt="illustration" />
      </div>
      <div class="card-content">
        <span class="card-category">Learning</span>
        <h5>Published 21 Dec 2023</h5>
        <h1>HTML & CSS foundations</h1>
        <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
        <div class="card-author">
          <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="author-avatar">
          <p class="author-name">Greg Hooper</p>
        </div>
      </div>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Arkharios">Arkharois</a>.
  </footer>
</body>
</html>
